<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Tarihçe - The Travel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="wiki-link.js"></script>
</head>
<body class="arkaplanli">
    <nav class="navbar">
        <a href="index.html" class="logo-alani" style="text-decoration: none; display: flex; align-items: center; gap: 10px; color: #fff;">
            <img src="img/galaxy.svg" alt="Galaksi Logosu">
            <h2 style="color: inherit; margin: 0;">Bilinen Galaksi</h2>
        </a>
        <div class="links">
            <a href="roman.html">Roman</a>
            <a href="index.html">Yıldız Haritası</a>
            <a href="tarihce.html">Tarihçe</a>
            <a href="wiki.html">Wiki</a>
        </div>
    </nav>
    
    <div class="sayfa-duzeni">
        <aside class="sidebar">
            <h3>Bölümler</h3>
            <ul id="tarihce-menu">
                <!-- JS ile otomatik dolacak -->
            </ul>
        </aside>
        
        <main class="metin" id="md-icerik">
            <!-- Bölümler JS ile buraya gelecek -->
        </main>
    </div>

    <script>
        // Tarihçe bölümleri wiki-dizin.json'dan gelir (senkron betiği, Obsidian'daki Tarihçe klasöründe
        // "yayinla: true" olan notları yazar; sırayı "sira", adı "baslik" alanı belirler)
        async function bolumleriGetir() {
            try {
                const yanit = await fetch('wiki-dizin.json');
                const dizin = yanit.ok ? await yanit.json() : {};
                return (dizin.tarihce || []).map(t => ({ id: `bolum-${t.no}`, dosya: t.dosya, isim: t.ad }));
            } catch (hata) {
                console.error("wiki-dizin.json okunamadı:", hata);
                return [];
            }
        }

        async function sayfalariYukle() {
            const menu = document.getElementById('tarihce-menu');
            const icerik = document.getElementById('md-icerik');
            const bolumler = await bolumleriGetir();
            await WikiLink.yukle();   // hangi maddelerin yazıldığını öğren

            for (const bolum of bolumler) {
                menu.innerHTML += `<li><a href="#${bolum.id}" id="link-${bolum.id}">${bolum.isim}</a></li>`;
                
                try {
                    let yanit = await fetch(encodeURI(bolum.dosya));
                    let metin = yanit.ok ? await yanit.text() : "";
                    if (!metin.trim()) metin = `<p>Burası şimdilik boş.</p>`;
                    
                    // Obsidian linkleri: yazılmış maddeye link, yazılmamışa noktalı altı çizili yazı (wiki-link.js)
                    metin = WikiLink.cevir(metin);

                    const htmlIcerik = marked.parse(metin, {breaks: true});

                    icerik.innerHTML += `
                        <div id="${bolum.id}" class="okuma-bolumu roman-detay">
                            <h2 class="baslik-kisim">${bolum.isim}</h2>
                            ${htmlIcerik}
                        </div>`;
                } catch (hata) {
                    console.error("Yükleme hatası:", hata);
                }
            }
            scrollTakip();
        }

        function scrollTakip() {
            const okumaBolumleri = document.querySelectorAll('.okuma-bolumu');
            const ayarlar = { 
                root: document.getElementById('md-icerik'), 
                rootMargin: '-20% 0px -70% 0px', 
                threshold: 0 
            };

            const gozlemleyici = new IntersectionObserver((girdiler) => {
                girdiler.forEach(girdi => {
                    if (girdi.isIntersecting) {
                        document.querySelectorAll('#tarihce-menu a').forEach(a => a.classList.remove('aktif-yan'));
                        const aktifLink = document.getElementById('link-' + girdi.target.id);
                        if(aktifLink) aktifLink.classList.add('aktif-yan');
                    }
                });
            }, ayarlar);

            okumaBolumleri.forEach(bolum => gozlemleyici.observe(bolum));
        }

        window.onload = sayfalariYukle;
    </script>
</body>
</html>
