<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Wiki - The Travel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="arkaplanli">
    <nav class="navbar">
        <a href="index.html" class="logo-alani" style="text-decoration: none; display: flex; align-items: center; gap: 10px; color: #fff;">
            <img src="img/galaxy.svg" alt="Galaksi Logosu">
            <h2 style="color: inherit; margin: 0;">Bilinen Galaksi</h2>
        </a>
        <div class="links">
            <a href="roman.html">Roman</a>
            <a href="index.html">Yıldız Haritası</a>
            <a href="tarihce.html">Tarihçe</a>
            <a href="wiki.html">Wiki</a>
        </div>
    </nav>
    
    <div class="sayfa-duzeni">
        <aside class="sidebar">
            <h3>Wiki Dizini</h3>
            <input type="text" id="wiki-arama" placeholder="Madde ara..." style="width: 100%; padding: 8px; margin-bottom: 20px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px;">
            
            <h4 style="color: #666; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px;">Son Eklenenler</h4>
            <ul id="son-eklenenler-listesi" style="list-style: none; padding: 0;">
                <!-- JSON'dan dinamik dolacak -->
            </ul>
        </aside>

        <main class="metin" id="wiki-icerik">
            <!-- İçerik buraya yüklenecek -->
        </main>
    </div>

    <script>
        async function sonEklenenleriDoldur() {
            try {
                let yanit = await fetch('site-veri.json');
                let veri = await yanit.json();
                const liste = document.getElementById('son-eklenenler-listesi');
                liste.innerHTML = '';
                veri.sonEklenenler.forEach(item => {
                    liste.innerHTML += `<li style="margin-bottom: 8px;"><a href="${item.url}" style="color: #4da6ff; text-decoration: none;">${item.baslik}</a></li>`;
                });
            } catch (hata) {
                console.error("Son eklenenler yüklenemedi:", hata);
            }
        }

        async function wikiMaddeYukle() {
            sonEklenenleriDoldur();
            
            const urlParams = new URLSearchParams(window.location.search);
            const madde = urlParams.get('madde'); 
            const icerikAlani = document.getElementById('wiki-icerik');

            if (madde) {
                try {
                    let yanit = await fetch(`${madde}.md`);
                    let metin = yanit.ok ? await yanit.text() : `<p>Burası şimdilik boş, hala üstüne düşünüyoruz, umarız retcona gerek kalmaz.</p>`;
                    
                    metin = metin.replace(/\[\[(.*?)\]\]/g, (match, icerik) => {
                        let parcalar = icerik.split('|');
                        let hedef = parcalar[0]; 
                        let gorunenAd = parcalar.length > 1 ? parcalar[1] : parcalar[0]; 
                        let urlFormat = encodeURIComponent(hedef.toLowerCase().trim().replace(/\s+/g, '-'));
                        return `[${gorunenAd}](wiki.html?madde=${urlFormat})`;
                    });

                    icerikAlani.innerHTML = `<div class="okuma-bolumu">${marked.parse(metin)}</div>`;
                } catch (hata) {
                    icerikAlani.innerHTML = `<div class="okuma-bolumu"><p>Burası şimdilik boş, hala üstüne düşünüyoruz, umarız retcona gerek kalmaz.</p></div>`;
                }
            } else {
                icerikAlani.innerHTML = `<div class="okuma-bolumu" style="max-width: 1000px;">
                    <h1>Wiki</h1>
                    <p>Evrene ait karakterler, yerler ve terimler veritabanı.</p>
                    <div class="wiki-kategoriler">
                        <div class="kategori-kutu"><h2>Gök Cisimleri</h2></div>
                        <div class="kategori-kutu"><h2>Şehirler</h2></div>
                        <div class="kategori-kutu"><h2>Karakterler</h2></div>
                        <div class="kategori-kutu"><h2>Teknoloji</h2></div>
                        <div class="kategori-kutu"><h2>Doğa</h2></div>
                        <div class="kategori-kutu"><h2>Devlet, Bölge ve Fraksiyonlar</h2></div>
                    </div>
                </div>`;
            }
        }

        document.getElementById('wiki-icerik').addEventListener('click', (e) => {
            const kutu = e.target.closest('.kategori-kutu');
            if (kutu) {
                let baslik = kutu.querySelector('h2').textContent;
                let urlFormat = encodeURIComponent(baslik.toLowerCase().trim().replace(/\s+/g, '-'));
                window.location.href = `wiki.html?madde=${urlFormat}`;
            }
        });

        window.onload = wikiMaddeYukle;
    </script>
</body>
</html>
