<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wiki - The Travel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="wiki.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body class="arkaplanli wiki-sayfasi">
    <nav class="navbar">
        <a href="index.html" class="logo-alani" style="text-decoration: none; display: flex; align-items: center; gap: 10px; color: #fff;">
            <img src="img/galaxy.svg" alt="Galaksi Logosu">
            <h2 style="color: inherit; margin: 0;">Bilinen Galaksi</h2>
        </a>
        <div class="links">
            <a href="roman.html">Roman</a>
            <a href="index.html">Yıldız Haritası</a>
            <a href="tarihce.html">Tarihçe</a>
            <a href="wiki.html" class="active">Wiki</a>
        </div>
    </nav>

    <div class="sayfa-duzeni">
        <aside class="sidebar wiki-yan">
            <h3>Wiki Dizini</h3>

            <div class="yan-blok arama-blok">
                <input type="search" id="wiki-arama" placeholder="Madde ara..." autocomplete="off">
                <ul id="arama-sonuc" class="arama-sonuc" hidden></ul>
            </div>

            <div class="yan-blok ilerleme-blok">
                <label for="okur-bolum" class="yan-etiket">Okuduğum son bölüm</label>
                <select id="okur-bolum"></select>
                <p class="yan-not">Bu bölümden sonrasına ait bilgiler bulanık gösterilir.</p>
            </div>

            <div class="yan-blok">
                <h4 class="yan-etiket">Kategoriler</h4>
                <ul class="yan-liste" id="kategori-listesi"></ul>
            </div>

            <div class="yan-blok">
                <h4 class="yan-etiket">Son Eklenenler</h4>
                <ul id="son-eklenenler-listesi" class="yan-liste"></ul>
            </div>
        </aside>

        <main class="metin" id="wiki-icerik">
            <p class="yukleniyor">Yükleniyor…</p>
        </main>
    </div>

    <script src="wiki-link.js"></script>
    <script src="wiki.js"></script>
</body>
</html>
