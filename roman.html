<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Roman · Kırlangıç Çırak</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <style>
        /* Romanın adı: bölümlerin üstünde */
        .roman-kapak { max-width: 800px; margin: 10px auto 44px; padding: 0 20px; text-align: center; }
        .roman-kapak h1 {
            margin: 0; color: #fff; font-family: 'Michroma', sans-serif; font-weight: 400;
            font-size: clamp(26px, 4.4vw, 50px); letter-spacing: 0.04em; line-height: 1.2;
            text-shadow: 0 0 22px rgba(77, 166, 255, 0.45);
        }
        .roman-kapak::after {
            content: ""; display: block; width: 160px; height: 1px; margin: 24px auto 0;
            background: linear-gradient(90deg, transparent, rgba(77, 166, 255, 0.85), transparent);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="wiki-link.js"></script>
</head>
<body class="arkaplanli">
    <nav class="navbar">
        <a href="index.html" class="logo-alani" style="text-decoration: none; display: flex; align-items: center; gap: 10px; color: #fff;">
            <img src="img/galaxy.svg" alt="Galaksi Logosu">
            <h2 style="color: inherit; margin: 0;">Bilinen Galaksi</h2>
        </a>
        <div class="links">
            <a href="roman.html">Roman</a>
            <a href="index.html">Yıldız Haritası</a>
            <a href="tarihce.html">Tarihçe</a>
            <a href="wiki.html">Wiki</a>
        </div>
    </nav>
    
    <div class="sayfa-duzeni">
        <aside class="sidebar">
            <h3>Bölümler</h3>
            <ul id="roman-menu">
                <!-- JS ile otomatik dolacak -->
            </ul>
        </aside>
        
        <main class="metin" id="md-icerik">
            <header class="roman-kapak"><h1>Kırlangıç Çırak</h1></header>
            <!-- Akordiyon yapısı alt alta buraya yüklenecek -->
        </main>
    </div>

    <script>
        // Yayınlanan bölümler wiki-dizin.json'dan gelir (senkron betiği, Obsidian'da "yayinla: true" olan bölümleri yazar)
        async function bolumleriGetir() {
            try {
                const yanit = await fetch('wiki-dizin.json');
                const dizin = yanit.ok ? await yanit.json() : {};
                return (dizin.bolumler || []).map(b => ({
                    id: `bolum-${b.no}`,
                    dosya: b.dosya || `roman/(${b.no}) ${b.ad} (${b.pov}).md`,
                    isim: `Kısım ${b.no}: ${b.ad}`,
                    pov: b.pov
                }));
            } catch (hata) {
                console.error("Bölüm listesi okunamadı:", hata);
                return [];
            }
        }

        async function sayfalariYukle() {
            const menu = document.getElementById('roman-menu');
            const icerik = document.getElementById('md-icerik');
            await WikiLink.yukle();   // hangi maddelerin yazıldığını öğren
            const bolumler = await bolumleriGetir();

            for (const bolum of bolumler) {
                menu.innerHTML += `<li><a href="#${bolum.id}" id="link-${bolum.id}">${bolum.isim}</a></li>`;
                
                try {
                    let yanit = await fetch(encodeURI(bolum.dosya));
                    let metin = yanit.ok ? await yanit.text() : `<p>Bu bölüm henüz yazılmadı.</p>`;
                    metin = metin.replace(/^\ufeff?---\r?\n[\s\S]*?\r?\n---[ \t]*\r?\n/, "");   // olası üst bilgiyi gizle
                    
                    // Obsidian linkleri: yazılmış maddeye link, yazılmamışa noktalı altı çizili yazı (wiki-link.js)
                    metin = WikiLink.cevir(metin);

                    const htmlIcerik = marked.parse(metin, {breaks: true});
                    icerik.innerHTML += `
                        <details id="${bolum.id}" class="roman-bolumu">
                            <summary>
                                <span class="baslik-kisim">${bolum.isim}</span> 
                                <span class="pov-isim">${bolum.pov}</span>
                            </summary>
                            <div class="roman-detay">${htmlIcerik}</div>
                        </details>`;
                } catch (hata) {
                    console.error("Yükleme hatası:", hata);
                }
            }
            scrollTakip();
        }

        function scrollTakip() {
            const okumaBolumleri = document.querySelectorAll('.roman-bolumu');
            const ayarlar = { 
                root: document.getElementById('md-icerik'), 
                rootMargin: '-20% 0px -70% 0px', 
                threshold: 0 
            };

            const gozlemleyici = new IntersectionObserver((girdiler) => {
                girdiler.forEach(girdi => {
                    if (girdi.isIntersecting) {
                        document.querySelectorAll('#roman-menu a').forEach(a => a.classList.remove('aktif-yan'));
                        const aktifLink = document.getElementById('link-' + girdi.target.id);
                        if(aktifLink) aktifLink.classList.add('aktif-yan');
                    }
                });
            }, ayarlar);

            okumaBolumleri.forEach(bolum => gozlemleyici.observe(bolum));
        }

        window.onload = sayfalariYukle;
    </script>
</body>
</html>
